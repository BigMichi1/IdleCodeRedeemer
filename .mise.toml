# Mise environment configuration for Idle Code Redeemer Bot
#
# NODE_TLS_REJECT_UNAUTHORIZED is deliberately NOT set here. It disables
# certificate validation for every outbound TLS connection in the process,
# including the Discord gateway. The Idle Champions host exception is scoped to
# that host's own requests via IDLE_CHAMPIONS_INSECURE_TLS (see
# src/bot/api/idleChampionsApi.ts).

[tools]
# Bun runtime and package manager
bun = "1.4.0"
# Claude Code CLI
claude = "2.1.245"
# Gitleaks for secret detection
gitleaks = "8.30.1"
# ripgrep for fast source search
rg = "15.2.0"
# jq builds the release attestation JSON and is used to inspect API output
jq = "1.8.1"

[tasks.install]
description = "Install dependencies with Bun"
run = "bun install"

[tasks."ci:install"]
description = "Install all dependencies exactly as locked (fails if bun.lock is stale)"
run = "bun install --frozen-lockfile"

[tasks."prod:install"]
description = "Install production dependencies only with Bun"
run = "bun install --production --frozen-lockfile --ignore-scripts"

[tasks.dev]
description = "Run bot in development mode with TypeScript support"
run = "bun run dev"
env = { NODE_ENV = "development" }

[tasks.build]
description = "Build the minified standalone executable (dist-bundle/bot)"
run = "bun run build"

[tasks.typecheck]
description = "Type-check TypeScript source without emitting files"
run = "bun run typecheck"

[tasks.test]
description = "Run all tests"
run = "bun test"

[tasks."test:coverage"]
description = "Run all tests with LCOV coverage report (output: coverage/lcov.info)"
run = "bun test --coverage --coverage-reporter=lcov"

[tasks."prod:build"]
# Identical to `build` apart from NODE_ENV, which nothing in src/bot/ reads.
# Kept as a named entry point for CI/deploy scripts.
description = "Alias for build, with NODE_ENV=production"
run = "bun run build"
env = { NODE_ENV = "production" }

[tasks.start]
description = "Start the bot in production"
run = "bun run start"
env = { NODE_ENV = "production" }

[tasks."prod:start"]
# Byte-identical to `start`; kept as a named entry point for deploy scripts.
description = "Alias for start"
run = "bun run start"
env = { NODE_ENV = "production" }

[tasks.docker-build]
description = "Build Docker image"
run = "docker build -t idle-code-redeemer ."

[tasks.docker-up]
description = "Start bot with Docker Compose"
run = "docker-compose up -d"

[tasks.docker-down]
description = "Stop bot with Docker Compose"
run = "docker-compose down"

[tasks.docker-logs]
description = "View Docker bot logs"
run = "docker-compose logs -f idle-code-redeemer"

[tasks.docker-restart]
description = "Restart bot container"
run = "docker-compose restart idle-code-redeemer"

[tasks."db:generate"]
description = "Generate a Drizzle migration from the schema in src/bot/database/schema"
run = "bun run db:generate"

[tasks."db:studio"]
description = "Open Drizzle Studio against the local database"
run = "bun run db:studio"

[tasks.lint]
description = "Check code quality with ESLint"
run = "bun run lint"

[tasks.format]
description = "Format sources with Prettier and sync package.json with Syncpack"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing changes"
run = "bun run format:check"

[tasks."lint:fix"]
description = "Auto-fix ESLint issues"
run = "bun run lint:fix"

[tasks.gitleaks]
# The config path is part of the task, not the caller. The pre-commit hook used
# to append its own `detect --source . --config ...`, producing a duplicated
# argument list that gitleaks silently tolerated.
description = "Scan for secrets with Gitleaks"
run = "gitleaks detect --source . --config .gitleaks.toml --verbose"

[tasks."deps:submit"]
# GitHub's dependency graph does not parse bun.lock, so transitive packages are
# invisible to Dependabot alerts unless the resolved tree is submitted.
description = "Submit the resolved bun.lock tree to GitHub's dependency graph"
run = "bun run scripts/dependency-snapshot.ts"

[tasks."deps:snapshot"]
description = "Print the dependency snapshot that deps:submit would send"
run = "bun run scripts/dependency-snapshot.ts --dry-run"

[tasks.audit]
description = "Audit dependencies for vulnerabilities"
run = "bun audit"

[tasks."audit:ci"]
# Gate on every severity rather than a threshold, with known-unfixable findings
# named explicitly so a new advisory of any level still fails the build.
#
# Both ignored IDs are esbuild development-server issues reaching the tree only
# through drizzle-kit 0.31.10 (already the latest release), which pins the
# affected copies via tsx and the deprecated @esbuild-kit/core-utils. esbuild is
# a build-time bundler here and is not present in the runtime image.
description = "Fail on any dependency advisory that is not a known upstream-blocked exception"
run = "bun audit --ignore GHSA-67mh-4wv8-2f99 --ignore GHSA-g7r4-m6w7-qqqr"

[tasks.outdated]
description = "Check for outdated dependencies"
run = "bun outdated"

[tasks.update]
description = "Update all dependencies"
run = "bun update"

[tasks.clean]
# The build output is dist-bundle/ (dist/ is never produced) and the lockfile is
# bun.lock, not bun.lockb -- the old globs removed neither.
description = "Remove build output and installed dependencies (keeps bun.lock)"
run = "rm -rf dist-bundle node_modules"

[tasks.setup]
description = "Complete initial setup"
depends = ["install"]
run = '''
echo "✅ Dependencies installed!"
echo ""
echo "Next steps:"
echo "1. Copy .env.example to .env"
echo "2. Add your DISCORD_TOKEN"
echo "3. Generate an encryption key:  openssl rand -hex 32"
echo "   and set it as ENCRYPTION_KEY in .env (required - the bot exits without it)"
echo "4. Run: ./bin/mise run dev"
'''

[tasks.commitlint]
description = "Validate commit message format"
run = "bunx commitlint --edit"

[tasks.help]
description = "Show all available tasks"
run = "mise tasks --list"
