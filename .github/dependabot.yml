version: 2
updates:
  # Bun dependencies
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "bun"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: auto
    # Syncpack enforces exact pins on every dependency, so `lockfile-only` left
    # Dependabot with nothing it was allowed to change: the single pinned
    # version is the only one the manifest range admits. `increase` lets it
    # rewrite the pin itself, which is how discord.js 14.26.4 sat untouched
    # while 14.27.0 was published.
    versioning-strategy: increase

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # All github/codeql-action/* steps must run the same version; separate PRs
    # per sub-action produce a version mismatch that fails the CodeQL analysis.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "github_actions"

  # Docker dependencies
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "docker"

  # Docker Compose dependencies
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "docker_compose"
