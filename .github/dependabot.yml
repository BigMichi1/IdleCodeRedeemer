version: 2
updates:
  # Bun dependencies
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    # Packages in these families must move together. When Dependabot bumped
    # @commitlint/config-conventional on its own, the newer config pulled an
    # ESM-only dependency the pinned CLI could not require and every commit
    # failed; @typescript-eslint/parser and its plugin sat two minors apart for
    # the same reason. Grouping makes each family one PR.
    groups:
      commitlint:
        patterns:
          - "commitlint"
          - "@commitlint/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      prettier:
        patterns:
          - "prettier"
          - "prettier-plugin-*"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "bun"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: auto
    # Syncpack enforces exact pins on every dependency, so `lockfile-only` left
    # Dependabot with nothing it was allowed to change: the single pinned
    # version is the only one the manifest range admits. `increase` lets it
    # rewrite the pin itself, which is how discord.js 14.26.4 sat untouched
    # while 14.27.0 was published.
    versioning-strategy: increase
    ignore:
      # typescript-eslint does not support TS 7.0: the plugin throws on load,
      # which breaks `mise run lint` and with it the pre-commit hook. TS 7.0.2
      # merged automatically once and had to be reverted. Lift this once
      # typescript-eslint ships TS 7 support.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    # All github/codeql-action/* steps must run the same version; separate PRs
    # per sub-action produce a version mismatch that fails the CodeQL analysis.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "github_actions"

  # Docker dependencies
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "docker"

  # Docker Compose dependencies
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
    reviewers:
      - BigMichi1
      - Copilot
    labels:
      - "dependencies"
      - "automerge"
      - "docker_compose"
