name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ github.event.before || github.event.repository.default_branch }}
          head: ${{ github.event.after || 'HEAD' }}
          extra_args: --debug

  environment-files:
    name: Check for Untracked Environment Files
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect untracked .env files
        run: |
          set +e
          found_env_files=0
          
          for file in .env .env.local .env.*.local .env.production; do
            if [ -f "$file" ] && git ls-files --error-unmatch "$file" > /dev/null 2>&1; then
              echo "❌ ERROR: Tracked environment file found: $file"
              echo "   This file should NOT be committed to the repository!"
              echo ""
              found_env_files=1
            fi
          done
          
          if [ $found_env_files -eq 1 ]; then
            echo "Remove the file from git history:"
            echo "  git rm --cached <filename>"
            echo "  git commit -m 'Remove tracked env file'"
            exit 1
          else
            echo "✅ No tracked environment files found"
          fi

      - name: Check for hardcoded secrets
        run: |
          set +e
          found_issues=0

          # Match an ASSIGNMENT of a secret-ish name to a literal value, e.g.
          #   DISCORD_TOKEN = "abc123..."   apiKey: 'xyz...'
          # A bare mention is not evidence of a secret: security comments and
          # redaction key lists legitimately contain these words, and flagging
          # them punished exactly the code that prevents leaks.
          #
          # Real detection is handled by Gitleaks and TruffleHog in this same
          # workflow; this step is a cheap backstop for obvious hardcoding.
          assignment='(DISCORD_TOKEN|DATABASE_URL|API_KEY|SECRET_KEY|PRIVATE_KEY|AWS_ACCESS_KEY|PASSWORD|ENCRYPTION_KEY)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{8,}'

          matches=$(git grep -inE "$assignment" -- \
            ':!.env*' \
            ':!*.example' \
            ':!*.md' \
            ':!*.yml' \
            ':!*.yaml' \
            ':!*.toml' \
            ':!*.gitignore*' \
            ':!.gitleaksignore' \
            ':!node_modules' \
            ':!*.d.ts' \
            ':!.github' \
            ':!src/test/setup.ts' | grep -v "node_modules")

          # src/test/setup.ts is excluded: it sets a deliberately fake
          # ENCRYPTION_KEY ('deadbeef' repeated) so the suite can run against an
          # in-memory database. Gitleaks still scans it.

          if [ -n "$matches" ]; then
            echo "⚠️  Found what looks like a hardcoded secret assignment:"
            echo "$matches" | head -10
            found_issues=1
          fi

          if [ $found_issues -eq 1 ]; then
            echo ""
            echo "Move the value to an environment variable and remove it from the file."
            exit 1
          else
            echo "✅ No hardcoded secret assignments found"
          fi

