# Full dependency audit against the current advisory database.
#
# Pull requests only fail on advisories they introduce (see audit:pr in
# .mise.toml), so this is what reports an advisory published against a package
# already on main. It fails here, on main's own status, instead of on every
# open PR at once.
name: Dependency Audit

on:
  push:
    branches:
      - main
  schedule:
    # Daily, so a new advisory surfaces within a day even with no pushes.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain (mise)
        run: ./bin/mise install

      - name: Audit dependencies
        run: ./bin/mise run audit:ci
